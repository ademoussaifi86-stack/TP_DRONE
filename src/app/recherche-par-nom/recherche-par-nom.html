<div class="container">
  <h2>Recherche par nom avec keyup</h2>

  <input
    type="text"
    class="form-control"
    #searchTerm
    (keyup)="onKeyUp(searchTerm.value)"
    placeholder="Saisir le nom du drone">

  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Marque</th>
        <th>Prix</th>
        <th>Type</th>
      </tr>
    </thead>

    <tbody>
      @for (drone of drones; track drone.idDrone) {
        <tr>
          <td>{{ drone.idDrone }}</td>
          <td>{{ drone.nomDrone }}</td>
          <td>{{ drone.marqueDrone }}</td>
          <td>{{ drone.prixDrone }} DT</td>
          <td>{{ drone.type?.nomType }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucun drone trouvé.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
