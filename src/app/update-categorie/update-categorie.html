
<div class="container mt-3">

  <h3>
    {{ ajout ? 'Ajouter une catégorie' : 'Modifier une catégorie' }}
  </h3>

  <form (ngSubmit)="saveCategorie()" #f="ngForm">

    @if (!ajout) {
      <div class="form-group mb-3">
        <label>ID Catégorie :</label>
        <input
          type="number"
          name="idType"
          class="form-control"
          [(ngModel)]="categorie.idType"
          readonly>
      </div>
    }

    <div class="form-group mb-3">
      <label>Nom Catégorie :</label>
      <input
        type="text"
        name="nomType"
        class="form-control"
        [(ngModel)]="categorie.nomType"
        required>
    </div>

    <button
      type="submit"
      class="btn btn-success"
      [disabled]="f.invalid">
      {{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>

  </form>

</div>
